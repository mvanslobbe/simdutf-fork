name: bench simdutf#1065

on:
  push:
    branches: [bench-pr1065]

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc-14, gcc-15, clang-18]
    env:
      ROUNDS: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc-15)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y g++-15
              echo "CC=gcc-15" >> "$GITHUB_ENV"
              echo "CXX=g++-15" >> "$GITHUB_ENV" ;;
            gcc-14)
              sudo apt-get update
              sudo apt-get install -y g++-14
              echo "CC=gcc-14" >> "$GITHUB_ENV"
              echo "CXX=g++-14" >> "$GITHUB_ENV" ;;
            clang-18)
              sudo apt-get update
              sudo apt-get install -y clang-18
              echo "CC=clang-18" >> "$GITHUB_ENV"
              echo "CXX=clang++-18" >> "$GITHUB_ENV" ;;
          esac

      - name: Machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
          $CXX --version | head -1

      - name: Data
        run: |
          python3 bench/make_data.py data
          git clone -q --depth 1 https://github.com/lemire/base64data base64data
          cp -r base64data/images base64data/email data/
          for d in data/*; do echo "$d: $(ls "$d" | wc -l) files, $(cat "$d"/*.txt | wc -c) bytes"; done

      - name: Build
        run: |
          mkdir -p bin
          while read -r name url ref; do
            bench/build.sh "$name" "$url" "$ref"
          done < bench/variants.txt

      - name: Benchmark
        run: |
          bench/run.sh "$ROUNDS" data $(cut -d' ' -f1 bench/variants.txt) | tee results.txt

      - name: Summary
        run: |
          {
            python3 bench/summarise.py results.txt "${{ matrix.os }} ${{ matrix.compiler }} ($(nproc) CPUs, best of $ROUNDS)"
            echo '```'
            cat bin/revisions.txt
            lscpu | grep 'Model name'
            $CXX --version | head -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            results.txt
            bin/revisions.txt
